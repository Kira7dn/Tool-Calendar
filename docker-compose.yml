services:
  official-doc-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-coordination-system
    expose:
      - "5000"
    ports:
      - "59607:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_PATH=/app/data/documents.db
      - OcrSettings__TessDataPath=/usr/share/tesseract-ocr/5/tessdata
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata
      - TZ=Asia/Ho_Chi_Minh
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_ID_SECRET=${PUBLIC_ID_SECRET}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # --- OCR Performance Tuning ---
      - OcrSettings__RenderDpi=200          # Giảm từ 300 → 200 DPI: nhanh hơn ~2x, vẫn đủ chất lượng nhận dạng tiếng Việt
      - OcrSettings__MaxParallelPages=4     # Xử lý song song 4 trang/lúc (thay vì 2)
      - OcrSettings__MaxPagesToScan=7       # Chỉ OCR tối đa 7 trang đầu tiên (công văn thường < 5 trang)
      - OcrSettings__EnableOsd=false        # Tắt auto-rotate detection: tiết kiệm ~2-3 giây/trang
      - OcrSettings__EnableDeskew=false     # Tắt deskew: tiết kiệm ~1-2 giây/trang
      # --- RabbitMQ Settings ---
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
    depends_on:
      - rabbitmq
    volumes:
      - ./data_dump:/app/data
      - ./ToolCalendar.Api/Uploads:/app/Uploads
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: doc-coordination-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - official-doc-backend
    restart: always

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: doc-coordination-ngrok
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ -n "$$NGROK_DOMAIN" ]; then
          ngrok http nginx-proxy:80 --domain=$$NGROK_DOMAIN
        else
          ngrok http nginx-proxy:80
        fi
    depends_on:
      - nginx


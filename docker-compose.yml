services:
  python-ai-service:
    build:
      context: ./python-ai-service
    container_name: python-ai-service
    expose:
      - "8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./ToolCalendar.Api/Uploads:/app/Uploads:ro
    environment:
      - DOCLING_USE_SIMPLE_PIPELINE=true
    restart: always

  official-doc-backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: doc-coordination-system
    expose:
      - "5000"
    ports:
      - "59607:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ✅ Tầng 5: Chạy container với quyền tối thiểu — chống leo thang quyền (ransomware)
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_PATH=/app/data/documents.db
      - TZ=Asia/Ho_Chi_Minh
      - Ollama__ChatUrl=http://host.docker.internal:11434/api/chat
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_ID_SECRET=${PUBLIC_ID_SECRET}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # --- ClamAV Config ---
      - ClamAv__Host=clamav
      - ClamAv__Port=3310
      # --- OCR Performance Tuning ---
      - OcrSettings__RenderDpi=400
      - OcrSettings__MaxParallelPages=2
      - OcrSettings__MaxPagesToScan=7
      - OcrSettings__EnableOsd=true
      - OcrSettings__EnableDeskew=true
      # --- RabbitMQ Settings ---
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
    depends_on:
      - rabbitmq
      - clamav
    volumes:
      - ./data_dump:/app/data
      - ./ToolCalendar.Api/Uploads:/app/Uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: doc-coordination-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  # ✅ Tầng 1: ClamAV Anti-Virus Scanner
  # Container riêng biệt, cô lập hoàn toàn với backend
  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: doc-clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false  # Cập nhật database virus tự động
      - CLAMD_CONF_MaxFileSize=100M
      - CLAMD_CONF_StreamMaxLength=100M
    volumes:
      - clamav-db:/var/lib/clamav  # Database virus được persist giữa các lần khởi động
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - official-doc-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

volumes:
  clamav-db:  # Named volume — ClamAV virus database tồn tại giữa các lần restart

services:
  python-ai-service:
    build:
      context: ./python-ai-service
    container_name: python-ai-service
    expose:
      - "8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./ToolCalendar.Api/Uploads:/app/Uploads:ro
    environment:
      - DOCLING_USE_SIMPLE_PIPELINE=false
      - TZ=Asia/Ho_Chi_Minh
    mem_limit: 2560m
    memswap_limit: 2560m
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tool-calendar-net

  official-doc-backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: doc-coordination-system
    expose:
      - "5000"
    ports:
      - "59607:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ✅ Tầng 5: Chạy container với quyền tối thiểu — chống leo thang quyền (ransomware)
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_PATH=/app/data/documents.db
      - TZ=Asia/Ho_Chi_Minh
      - Ollama__ChatUrl=http://ollama:11434/api/chat
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_ID_SECRET=${PUBLIC_ID_SECRET}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # --- ClamAV Config ---
      - ClamAv__Host=clamav
      - ClamAv__Port=3310
      # --- OCR Performance Tuning ---
      - OcrSettings__RenderDpi=400
      - OcrSettings__MaxParallelPages=2
      - OcrSettings__MaxPagesToScan=7
      - OcrSettings__EnableOsd=true
      - OcrSettings__EnableDeskew=true
      # --- RabbitMQ Settings ---
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
    depends_on:
      - rabbitmq
      - clamav
    volumes:
      - ./data_dump:/app/data
      - ./ToolCalendar.Api/Uploads:/app/Uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tool-calendar-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: doc-coordination-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - tool-calendar-net

  # ✅ Tầng 1: ClamAV Anti-Virus Scanner
  # Container riêng biệt, cô lập hoàn toàn với backend
  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: doc-clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false  # Cập nhật database virus tự động
      - CLAMD_CONF_MaxFileSize=500M
      - CLAMD_CONF_StreamMaxLength=500M
    volumes:
      - clamav-db:/var/lib/clamav  # Database virus được persist giữa các lần khởi động
    mem_limit: 1536m
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - tool-calendar-net



  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    mem_limit: 256m
    cpus: "0.5"
    restart: unless-stopped
    networks:
      - tool-calendar-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: 1024m
    cpus: "1.0"
    restart: unless-stopped
    networks:
      - tool-calendar-net

volumes:
  clamav-db:  # Named volume — ClamAV virus database tồn tại giữa các lần restart
  uptime-kuma-data:
  ollama-data:

networks:
  tool-calendar-net:
    driver: bridge

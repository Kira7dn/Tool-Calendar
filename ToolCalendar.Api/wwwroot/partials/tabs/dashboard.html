<section id="tab-dashboard" class="tab-content active-tab">
    <div class="stats-grid">
        <div class="stat-card">
            <p class="stat-label" data-i18n="total_docs">Tổng văn bản</p>
            <p class="stat-value" id="stat-total">0</p>
            <p class="stat-info" style="color: var(--primary)" data-i18n="system_data">Dữ liệu toàn hệ thống</p>
        </div>
        <div class="stat-card">
            <p class="stat-label" data-i18n="nearly_due">Sắp hết hạn</p>
            <p class="stat-value" id="stat-urgent" style="color: var(--warning)">0</p>
            <p class="stat-info" style="color: var(--warning)" data-i18n="within_7_days">Trong vòng 7 ngày</p>
        </div>
        <div class="stat-card">
            <p class="stat-label" data-i18n="overdue">Đã quá hạn</p>
            <p class="stat-value" id="stat-overdue" style="color: var(--danger)">0</p>
            <p class="stat-info" style="color: var(--danger)" data-i18n="action_required">Cần xử lý ngay lập tức</p>
        </div>
        <div class="stat-card">
            <p class="stat-label" data-i18n="due_today">Đến hạn hôm nay</p>
            <p class="stat-value" id="stat-today" style="color: var(--success)">0</p>
            <p class="stat-info" style="color: var(--success)" data-i18n="final_deadline">Kỳ hạn cuối cùng</p>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="data-section dashboard-card" style="overflow-y: auto;">
            <h3 style="margin-bottom: 20px;" data-i18n="recent_activity">Xử lý gần đây</h3>
            <div class="table-scroll">
                <table id="recent-docs">
                    <thead>
                        <tr>
                            <th data-i18n="doc_no">Số văn bản</th>
                            <th data-i18n="summary">Trích yếu</th>
                            <th data-i18n="deadline">Thời hạn</th>
                            <th data-i18n="status">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="data-section dashboard-card chart-section"
            style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <h3 style="margin-bottom: 20px; align-self: flex-start;" data-i18n="completion_rate">Tỷ lệ hoàn thành</h3>
            <canvas id="statChart" style="max-width: 220px; max-height: 220px;"></canvas>
        </div>
    </div>
</section>

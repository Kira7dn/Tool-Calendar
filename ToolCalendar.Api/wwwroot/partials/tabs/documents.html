<section id="tab-documents" class="tab-content">
    <div class="data-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="section-header" style="flex-wrap: wrap; gap: 15px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <h3 style="margin: 0;" data-i18n="doc_list_title">Danh sách văn bản toàn đơn vị</h3>
                <button class="btn btn-primary-pill" data-tab="upload"
                    style="padding: 6px 16px; font-size: 0.85rem; height: 36px; white-space: nowrap;">
                    <span>&#10133; <span data-i18n="add_doc">Thêm văn bản</span></span>
                </button>
            </div>

            <div
                style="display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; min-width: 300px;">
                <div class="search-box" style="margin: 0; flex: 1; max-width: 300px;">
                    <span>&#128269;</span>
                    <input type="text" placeholder="Tìm số hiệu, nội dung..." id="doc-search" data-i18n-placeholder="search_placeholder">
                </div>
                <div class="filter-box" style="margin: 0;">
                    <select id="doc-status-filter"
                        style="padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; outline: none; font-size: 0.9rem; color: #1e293b; background: #fff; cursor: pointer;">
                        <option value="" data-i18n="all_status">Tất cả trạng thái</option>
                        <option value="Chưa xử lý">⏳ <span data-i18n="status_pending">Chưa xử lý</span></option>
                        <option value="Đang xử lý">⚙️ <span data-i18n="status_processing">Đang xử lý</span></option>
                        <option value="Đã rà soát">🔍 <span data-i18n="status_reviewed">Đã rà soát</span></option>
                        <option value="Đã hoàn thành">✅ <span data-i18n="status_completed">Đã hoàn thành</span></option>
                        <option value="Lỗi OCR">⚠️ <span data-i18n="status_error_ocr">Lỗi OCR</span></option>
                        <option value="overdue">🛑 <span data-i18n="status_overdue">Quá hạn</span></option>
                        <option value="urgent">🕒 <span data-i18n="status_urgent">Sắp hết hạn</span></option>
                        <option value="today">📅 <span data-i18n="status_today">Đến hạn hôm nay</span></option>
                    </select>
                </div>
                <div class="filter-box" style="margin: 0;">
                    <select id="doc-sort-filter"
                        style="padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; outline: none; font-size: 0.9rem; color: #1e293b; background: #fff; cursor: pointer;">
                        <option value="newest" data-i18n="sort_newest">📅 Mới nhất</option>
                        <option value="oldest" data-i18n="sort_oldest">📅 Cũ nhất</option>
                        <option value="deadline_asc" data-i18n="sort_deadline_near">⏳ Hạn gần nhất</option>
                        <option value="deadline_desc" data-i18n="sort_deadline_far">⏳ Hạn xa nhất</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="table-scroll" style="flex: 1; overflow-y: auto;">
            <table id="all-docs-table">
                <thead>
                    <tr>
                        <th style="width:48px; text-align:center;" data-i18n="stt">STT</th>
                        <th data-i18n="doc_no">Số văn bản</th>
                        <th data-i18n="publish_date">Ngày ban hành</th>
                        <th data-i18n="summary">Trích yếu</th>
                        <th data-i18n="dept_advise">Cơ quan tham mưu</th>
                        <th data-i18n="deadline">Thời hạn</th>
                        <th data-i18n="status">Trạng thái</th>
                        <th data-i18n="actions">Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="all-docs-pagination" class="pagination">
            <button class="btn" data-action="prev-doc-page" id="btn-prev-docs"
                style="background: #e2e8f0; color: #1e293b;" data-i18n="prev">Trước</button>
            <span id="docs-page-info" style="color: var(--text-secondary);">Trang 1 / 1</span>
            <button class="btn" data-action="next-doc-page" id="btn-next-docs"
                style="background: #e2e8f0; color: #1e293b;" data-i18n="next">Sau</button>
        </div>
    </div>
</section>

<div id="user-modal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <div class="modal-header">
            <h3 id="user-modal-title" data-i18n="edit_account">Chỉnh sửa tài khoản</h3>
            <button class="modal-close-btn" data-action="close-user-modal">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-user-id">
            <div class="form-group" id="username-group">
                <label style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;"
                    data-i18n="username">Tên đăng nhập</label>
                <input type="text" id="new-username"
                    style="width: 100%; padding: 10px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-top: 15px;" id="password-group">
                <label style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;"
                    id="password-label" data-i18n="pwd_leave_blank">Mật khẩu (để trống nếu không đổi)</label>
                <div style="position: relative;">
                    <input type="password" id="new-password" data-i18n-placeholder="enter_new_pwd"
                        placeholder="Nhập mật khẩu mới..."
                        style="width: 100%; box-sizing: border-box; padding: 10px; padding-right: 40px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 6px;">
                    <span
                        onclick="var pwd = document.getElementById('new-password'); var type = pwd.getAttribute('type') === 'password' ? 'text' : 'password'; pwd.setAttribute('type', type); this.innerText = type === 'password' ? '👁️' : '🙈'; this.title = type === 'password' ? 'Hiện mật khẩu' : 'Ẩn mật khẩu';"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; font-size: 1.1rem; user-select: none;"
                        title="Hiện mật khẩu">👁️</span>
                </div>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;"
                    data-i18n="full_name">Họ tên</label>
                <input type="text" id="new-fullname"
                    style="width: 100%; padding: 10px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;"
                    data-i18n="email">Email</label>
                <input type="email" id="new-email"
                    style="width: 100%; padding: 10px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;"
                    data-i18n="phone">Số điện thoại</label>
                <input type="text" id="new-phone"
                    style="width: 100%; padding: 10px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;"
                    data-i18n="department">Phòng ban</label>
                <select id="new-department"
                    style="width: 100%; padding: 10px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 6px;">
                    <option value="">-- Chọn phòng ban --</option>
                    <!-- Sẽ được fill bằng JS -->
                </select>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px;"
                    data-i18n="role">Vai trò</label>
                <select id="new-role"
                    style="width: 100%; padding: 10px; background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 6px;">
                    <option value="Admin" data-i18n="Admin">Quản trị viên</option>
                    <option value="LanhDao" data-i18n="LanhDao">Lãnh đạo</option>
                    <option value="VanThu" data-i18n="VanThu">Văn thư</option>
                    <option value="CanBo" data-i18n="CanBo">Cán bộ</option>
                </select>
            </div>
        </div>
        <div class="modal-footer" style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
            <button class="btn btn-secondary" data-action="close-user-modal" data-i18n="cancel">Hủy</button>
            <button class="btn btn-primary" data-action="save-user" data-i18n="save_account">Lưu tài khoản</button>
        </div>
    </div>
</div>

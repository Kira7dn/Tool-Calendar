<div id="dept-modal" class="modal">
    <div class="modal-content" style="max-width: 420px;">
        <div class="modal-header">
            <h3 id="dept-modal-title" data-i18n="add_department">🏢 Thêm Phòng ban</h3>
            <button class="modal-close-btn" data-action="close-dept-modal">&times;</button>
        </div>
        <div class="form-group" style="margin-bottom:16px;">
            <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px;"
                data-i18n="department">Tên phòng ban</label>
            <input type="text" id="dept-name" placeholder="Vd: Phòng Tài chính"
                style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; color:#1e293b; font-size:0.9rem;">
        </div>
        <div class="form-group" style="margin-bottom:20px;">
            <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px;"
                data-i18n="summary">Mô tả</label>
            <input type="text" id="dept-desc" placeholder="Mô tả ngắn (tùy chọn)"
                style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; color:#1e293b; font-size:0.9rem;">
        </div>
        <div class="modal-footer" style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn btn-secondary" data-action="close-dept-modal" data-i18n="cancel">Hủy</button>
            <button class="btn btn-primary" data-action="save-department" data-i18n="save">Lưu phòng ban</button>
        </div>
    </div>
</div>

<!-- Mobile Full-Screen Document Detail Page -->
<!-- Trượt vào từ phải như native app, dùng lại tất cả ID của modal hiện có -->
<div id="doc-detail-page"
    style="display:none; position:fixed; inset:0; z-index:2500; background:#f0f2f5; flex-direction:column; transform:translateX(100%); transition:transform 0.32s cubic-bezier(0.4,0,0.2,1); will-change:transform; overflow:hidden;">

    <!-- Page Header (sticky top bar) -->
    <div id="doc-page-topbar"
        style="display:flex; align-items:center; gap:12px; padding:12px 16px; background:white; border-bottom:1px solid #e4e6eb; flex-shrink:0; padding-top: env(safe-area-inset-top, 12px);">
        <button data-action="close-doc-detail-page"
            style="width:38px; height:38px; background:#f0f2f5; border:none; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#1c1e21; flex-shrink:0;">
            <i data-lucide="arrow-left" style="width:20px; height:20px;"></i>
        </button>
        <div style="flex:1; min-width:0;">
            <div id="doc-page-title"
                style="font-size:1rem; font-weight:800; color:#1c1e21; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                Chi tiết văn bản</div>
            <div id="doc-page-subtitle"
                style="font-size:0.75rem; color:#65676b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;">
            </div>
        </div>
        <!-- Edit / more options -->
        <div id="doc-page-actions" style="display:flex; gap:8px; flex-shrink:0;">
            <button id="doc-page-edit-btn" data-action="switch-doc-page-tab" data-page-tab="edit"
                style="display:none; padding:6px 14px; background:#1a3a6e; color:white; border:none; border-radius:20px; font-size:0.82rem; font-weight:700; cursor:pointer;">
                ✏️ Sửa
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div id="doc-page-tabs"
        style="display:flex; background:white; border-bottom:2px solid #e4e6eb; flex-shrink:0; overflow-x:auto; padding:0 8px;">
        <button id="doc-page-tab-view" class="doc-page-tab active" data-action="switch-doc-page-tab"
            data-page-tab="view">📋 Chi tiết</button>
        <button id="doc-page-tab-edit" class="doc-page-tab" data-action="switch-doc-page-tab" data-page-tab="edit"
            style="display:none;">✏️ Chỉnh sửa</button>
        <button id="doc-page-tab-comments" class="doc-page-tab" data-action="switch-doc-page-tab"
            data-page-tab="comments">
            💬 Bình luận
            <span id="doc-page-comment-badge"
                style="background:#c0392b; border-radius:99px; padding:1px 6px; font-size:0.68rem; margin-left:4px; color:white;">0</span>
        </button>
    </div>

    <!-- Scrollable Content -->
    <div style="flex:1; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom, 20px);">

        <!-- === VIEW PANEL === -->
        <div id="doc-page-panel-view" style="padding:16px; display:flex; flex-direction:column; gap:12px;">

            <!-- Stat summary chips (quick overview) -->
            <div id="doc-page-chips"
                style="display:flex; flex-wrap:wrap; gap:8px; padding-bottom:4px;">
            </div>

            <!-- Fields card -->
            <div style="background:white; border-radius:16px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
                <div class="doc-page-field-row" id="dpf-so" data-label="Số văn bản"></div>
                <div class="doc-page-field-row" id="dpf-ngaybanhanh" data-label="Ngày ban hành"></div>
                <div class="doc-page-field-row doc-page-field-full" id="dpf-trichyeu" data-label="Trích yếu"></div>
                <div class="doc-page-field-row" id="dpf-coquanbanhanh" data-label="Cơ quan ban hành"></div>
                <div class="doc-page-field-row" id="dpf-coquanchuquan" data-label="Cơ quan tham mưu"></div>
                <div class="doc-page-field-row" id="dpf-thoihan" data-label="Thời hạn xử lý"></div>
                <div class="doc-page-field-row" id="dpf-status" data-label="Trạng thái"></div>
                <div class="doc-page-field-row" id="dpf-priority" data-label="Độ khẩn"></div>
                <div class="doc-page-field-row" id="dpf-ngaythem" data-label="Ngày thêm"></div>
            </div>

            <!-- File attachment -->
            <div id="doc-page-file"
                style="background:white; border-radius:16px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
                <p
                    style="font-size:0.72rem; font-weight:700; color:#65676b; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">
                    Tệp đính kèm</p>
                <div id="doc-page-file-content"></div>
            </div>

            <!-- Evidence -->
            <div id="doc-page-evidence-wrap" style="display:none;
                background:white; border-radius:16px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
                <p
                    style="font-size:0.72rem; font-weight:700; color:#65676b; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">
                    Bằng chứng xử lý</p>
                <div id="doc-page-evidence-content"></div>
            </div>
        </div>

        <!-- === EDIT PANEL === -->
        <div id="doc-page-panel-edit" style="padding:16px; display:none; flex-direction:column; gap:12px;">
            <div style="background:white; border-radius:16px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.08); display:flex; flex-direction:column; gap:14px;">
                <div>
                    <label class="doc-page-input-label">Số hiệu văn bản</label>
                    <input type="text" id="de-so" class="modal-input doc-page-input">
                </div>
                <div>
                    <label class="doc-page-input-label">Ngày ban hành</label>
                    <input type="date" id="de-ngaybanhanh" class="modal-input doc-page-input">
                </div>
                <div>
                    <label class="doc-page-input-label">Trích yếu</label>
                    <textarea id="de-trichyeu" class="modal-input doc-page-input" rows="4" style="resize:vertical;"></textarea>
                </div>
                <div>
                    <label class="doc-page-input-label">Cơ quan ban hành</label>
                    <input type="text" id="de-coquanbanhanh" class="modal-input doc-page-input">
                </div>
                <div>
                    <label class="doc-page-input-label">Cơ quan tham mưu</label>
                    <input type="text" id="de-coquanchuquan" class="modal-input doc-page-input">
                </div>
                <div>
                    <label class="doc-page-input-label">Thời hạn xử lý</label>
                    <input type="text" id="de-thoihan" class="modal-input doc-page-input" placeholder="dd/MM/yyyy" inputmode="numeric">
                </div>
                <div>
                    <label class="doc-page-input-label">Trạng thái</label>
                    <select id="de-status" class="modal-input doc-page-input" style="margin-bottom:6px;">
                        <option value="Chưa xử lý">Chưa xử lý</option>
                        <option value="Đang xử lý">Đang xử lý</option>
                        <option value="Đã rà soát">Đã rà soát</option>
                        <option value="Đã hoàn thành">Đã hoàn thành</option>
                        <option value="__custom__">✏️ Tùy chỉnh...</option>
                    </select>
                    <input type="text" id="de-status-custom" class="modal-input doc-page-input" placeholder="Nhập trạng thái tùy chỉnh..." style="display:none; margin-top:6px;">
                </div>
                <div>
                    <label class="doc-page-input-label">Độ khẩn</label>
                    <select id="de-priority" class="modal-input doc-page-input">
                        <option>Thường</option>
                        <option>Khẩn</option>
                        <option>Thượng khẩn</option>
                    </select>
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="flex:1; background:#e2e8f0; color:#1e293b;" data-action="switch-doc-page-tab" data-page-tab="view">Hủy</button>
                <button class="btn btn-primary" style="flex:2;" data-action="save-doc-page-detail">💾 Lưu thay đổi</button>
            </div>
        </div>

        <!-- === COMMENTS PANEL === -->
        <div id="doc-page-panel-comments" style="padding:16px; display:none; flex-direction:column; gap:12px;">
            <div id="doc-page-comment-list" style="display:flex; flex-direction:column; gap:10px;"></div>
            <!-- New comment box -->
            <div style="background:white; border-radius:16px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
                <p style="font-size:0.85rem; color:#65676b; margin-bottom:10px; font-weight:600;">✍️ Thêm bình luận</p>
                <textarea id="page-new-comment-text" rows="3" placeholder="Nhập nội dung bình luận..."
                    style="width:100%; border-radius:12px; background:#f0f2f5; border:none; color:#1c1e21; padding:12px; resize:vertical; outline:none; font-family:inherit; font-size:0.95rem;"></textarea>
                <div id="page-comment-attachments-preview" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;"></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
                    <div>
                        <input type="file" id="page-comment-file-input" multiple style="display:none;">
                        <button type="button" id="page-btn-comment-attach"
                            style="background:#e4e6eb; color:#65676b; border:none; border-radius:20px; padding:8px 16px; font-size:0.82rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;">
                            📎 Đính kèm
                        </button>
                    </div>
                    <button class="btn btn-primary" data-action="submit-comment"
                        style="border-radius:20px; padding:8px 20px;">Gửi</button>
                </div>
            </div>
        </div>
    </div>
</div>

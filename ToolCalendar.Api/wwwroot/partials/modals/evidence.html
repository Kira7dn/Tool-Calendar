<div id="evidence-modal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <h3>📎 <span data-i18n="mt_submit_title">Nộp bằng chứng hoàn thành</span></h3>
            <button class="modal-close-btn" data-action="close-evidence-modal">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="evidence-doc-id">
            <div class="form-group" style="margin-bottom:16px;">
                <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px;" data-i18n="mt_submit_notes">Ghi chú kết quả xử lý</label>
                <textarea id="evidence-notes" rows="3" placeholder="..." style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; color:#1e293b; font-size:0.9rem; resize:vertical;"></textarea>
            </div>
            <div class="form-group">
                <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px;" data-i18n="mt_submit_files">File bằng chứng (ảnh, PDF, tài liệu)</label>
                <input type="file" id="evidence-files" multiple style="width:100%; padding:8px; border:1.5px solid #cbd5e1; border-radius:8px; color:#1e293b;" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-action="close-evidence-modal" data-i18n="btn_cancel">Hủy</button>
            <button class="btn btn-primary" data-action="submit-evidence"><span data-i18n="mt_submit_btn">&#9989; Xác nhận hoàn thành</span></button>
        </div>
    </div>
</div>

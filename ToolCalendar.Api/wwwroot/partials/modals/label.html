<div id="label-modal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <h3 data-i18n="add">🏷️ Thêm Nhãn phân loại</h3>
            <button class="modal-close-btn" data-action="close-label-modal">&times;</button>
        </div>
        <div class="form-group" style="margin-bottom:16px;">
            <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px;"
                data-i18n="department">Tên nhãn</label>
            <input type="text" id="label-name" placeholder="Vd: Khẩn cần giải quyết"
                style="width:100%; padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; color:#1e293b; font-size:0.9rem;">
        </div>
        <div class="form-group" style="margin-bottom:20px;">
            <label style="display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px;"
                data-i18n="file">Màu hiển thị</label>
            <input type="color" id="label-color" value="#c0392b"
                style="width:80px; height:40px; border:1.5px solid #cbd5e1; border-radius:8px; cursor:pointer;">
        </div>
        <div class="modal-footer" style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn btn-secondary" data-action="close-label-modal" data-i18n="cancel">Hủy</button>
            <button class="btn btn-primary" data-action="create-label" data-i18n="save">Lưu nhãn</button>
        </div>
    </div>
</div>

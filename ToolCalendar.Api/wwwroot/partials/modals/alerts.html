<div id="custom-alert" class="modal">
    <div class="modal-content" style="max-width: 350px; text-align: center;">
        <div class="modal-body" style="padding: 30px;">
            <div id="alert-icon" style="font-size: 32px; margin-bottom: 15px;">&#128276;</div>
            <p id="alert-message" style="margin-bottom: 24px; line-height: 1.6; color: var(--text-primary); font-size: 0.95rem;"></p>
            <button class="btn btn-primary" data-action="close-alert" style="width: 100%; padding: 12px;">Đồng ý</button>
        </div>
    </div>
</div>

<div id="custom-confirm" class="modal">
    <div class="modal-content" style="max-width: 350px; text-align: center;">
        <div class="modal-body" style="padding: 30px;">
            <div style="font-size: 32px; margin-bottom: 15px;">&#10067;</div>
            <p id="confirm-message" style="margin-bottom: 24px; line-height: 1.6; color: var(--text-primary); font-size: 0.95rem;"></p>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-secondary" data-action="confirm-resolve" data-confirm-value="false" style="flex: 1;">Hủy</button>
                <button class="btn btn-primary" data-action="confirm-resolve" data-confirm-value="true" style="flex: 1;">Đồng ý</button>
            </div>
        </div>
    </div>
</div>

name: Deploy to VNPT Cloud

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/kira7dn/tool-calendar-backend:latest

      - name: Check if Python AI changed
        id: python-changes
        run: |
          PYTHON_CHANGED=$(git diff HEAD origin/develop -- python-ai-service/ | wc -l || echo "1")
          if [ "$PYTHON_CHANGED" -gt "0" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Python AI Image (if changed)
        if: steps.python-changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./python-ai-service
          push: true
          tags: ghcr.io/kira7dn/tool-calendar-python:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          port: 22
          script_timeout: 45m
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd /root/Tool-Calendar || exit 1
            git fetch origin develop
            git reset --hard origin/develop

            echo ">>> Đăng nhập vào Github Container Registry trên VPS..."
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            echo ">>> Pull image từ GHCR..."
            docker compose pull official-doc-backend
            docker compose pull python-ai-service || true

            echo ">>> Khởi động các container..."
            docker compose up -d --no-build official-doc-backend
            docker compose up -d --no-build python-ai-service

            # Reload Nginx
            docker exec nginx-proxy nginx -s reload || docker restart nginx-proxy

            echo ">>> Dọn dẹp image thừa..."
            docker image prune -f

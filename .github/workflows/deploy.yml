name: Deploy to VNPT Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/kira7dn/tool-calendar-backend:latest

      - name: Check if Python AI changed
        id: python-changes
        run: |
          # So sánh commit hiện tại với commit trước (HEAD~1..HEAD)
          # Dùng git log để fallback về 'true' nếu đây là commit đầu tiên
          PYTHON_CHANGED=$(git diff HEAD~1..HEAD -- python-ai-service/ 2>/dev/null | wc -l || echo "1")
          if [ "$PYTHON_CHANGED" -gt "0" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Python AI Image (if changed)
        if: steps.python-changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./python-ai-service
          push: true
          tags: ghcr.io/kira7dn/tool-calendar-python:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Export Backend Image to Tar
        run: |
          docker pull ghcr.io/kira7dn/tool-calendar-backend:latest
          docker save ghcr.io/kira7dn/tool-calendar-backend:latest -o backend.tar
          sudo chmod 777 backend.tar

      - name: SCP Backend Image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          port: 22
          source: "backend.tar"
          target: "/root/Tool-Calendar"

      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          port: 22
          script_timeout: 45m
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd /root/Tool-Calendar || exit 1
            git fetch origin develop
            git reset --hard origin/develop

            # --- Auto-generate PYTHON_AI_SECRET_KEY nếu chưa có ---
            # Key này dùng cho HMAC-SHA256 signing giữa C# backend và Python AI service
            ENV_FILE="/root/Tool-Calendar/.env"
            if [ ! -f "$ENV_FILE" ] || ! grep -q "PYTHON_AI_SECRET_KEY=" "$ENV_FILE"; then
              NEW_KEY=$(openssl rand -hex 32)
              echo "PYTHON_AI_SECRET_KEY=$NEW_KEY" >> "$ENV_FILE"
              echo ">>> [Security] PYTHON_AI_SECRET_KEY đã được generate và ghi vào .env"
            else
              echo ">>> [Security] PYTHON_AI_SECRET_KEY đã tồn tại trong .env, giữ nguyên."
            fi

            echo ">>> Đăng nhập vào Github Container Registry trên VPS..."
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            echo ">>> Load Backend image từ file tar (Bypass VNPT Network)..."
            docker load -i backend.tar
            rm backend.tar

            echo ">>> Pull Python AI image từ GHCR (Nếu có cập nhật)..."
            docker compose pull python-ai-service || true

            echo ">>> Khởi động các container..."
            docker container rm -f doc-coordination-system 2>/dev/null || true
            docker compose up -d --no-build --remove-orphans official-doc-backend
            docker compose up -d --no-build python-ai-service || echo "[WARN] python-ai-service image chưa sẵn sàng, bỏ qua."

            # Reload Nginx
            docker exec nginx-proxy nginx -s reload || docker restart nginx-proxy

            echo ">>> Dọn dẹp image thừa..."
            docker image prune -f
